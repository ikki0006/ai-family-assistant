name: 承認された改善
run-name: 改善実装（依頼 ${{ inputs.request_id }} / 版 ${{ inputs.version }}）
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      version:
        required: true
        type: string
      specification:
        required: true
        type: string
permissions: {}
concurrency:
  group: approved-improvements
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Generate bounded files (one Gemini call)
        run: node scripts/improvement-agent/generate.mjs
        env:
          CF_IMPROVEMENT_GATEWAY_TOKEN: ${{ secrets.CF_IMPROVEMENT_GATEWAY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AI_GATEWAY_ID: ai-family-assistant
          IMPROVEMENT_SPECIFICATION: ${{ inputs.specification }}
          IMPROVEMENT_ID: ${{ inputs.request_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: improvement-files
          path: improvement-files.json
          retention-days: 1
  verify:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: hashicorp/setup-terraform@v3
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: improvement-files
          path: ${{ runner.temp }}/improvement
      - run: node scripts/improvement-agent/apply.mjs "$RUNNER_TEMP/improvement/improvement-files.json"
      - name: Verify without AI or production secrets
        run: pnpm verify
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@v4
        with:
          name: improvement-files
          path: ${{ runner.temp }}/improvement
      - run: node scripts/improvement-agent/apply.mjs "$RUNNER_TEMP/improvement/improvement-files.json"
      - name: Create draft PR without executing generated code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          IMPROVEMENT_SPECIFICATION: ${{ inputs.specification }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[a-f0-9-]{36}$ ]]
          [[ "$REQUEST_VERSION" =~ ^[0-9]+$ ]]
          branch="improvement/$REQUEST_ID-v$REQUEST_VERSION"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/application/prompts tests/unit
          git diff --cached --quiet && exit 0
          node scripts/improvement-agent/pr-description.mjs "$RUNNER_TEMP/improvement/improvement-files.json" "$RUNNER_TEMP/improvement-title.txt" "$RUNNER_TEMP/improvement-body.md"
          git commit -F "$RUNNER_TEMP/improvement-title.txt"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "$(cat "$RUNNER_TEMP/improvement-title.txt")" --body-file "$RUNNER_TEMP/improvement-body.md"
